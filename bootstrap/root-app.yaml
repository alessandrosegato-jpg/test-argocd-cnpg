# App-of-Apps root: gestisce tutte le Argo CD Application presenti in apps/.
# Sostituire i placeholder repoURL e targetRevision (es. main) PRIMA di applicare.
# Nota: su hcpt4321765 il progetto per deploy locali (https://kubernetes.default.svc) è "default"
# (il progetto "default" è riservato ai cluster spoke remoti via ACM cluster-proxy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-cluster-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: "https://github.com/alessandrosegato-jpg/test-argocd-cnpg.git"
    targetRevision: "main"
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    # Decommentare dopo il bootstrap iniziale (approvazione InstallPlan e DB healthy) per auto-sync continuo:
    automated:
      prune: false
      selfHeal: true
